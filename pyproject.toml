[project]
name = "dbt-synthetic-data"
version = "0.1.0"
description = "Synthetic star-schema data generator for dbt + DuckDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.11.7",
    "dbt-duckdb>=1.10.1",
    "faker>=40.13.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyarrow>=23.0.1",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
]

[project.scripts]
generate-data = "generate_data:main"
