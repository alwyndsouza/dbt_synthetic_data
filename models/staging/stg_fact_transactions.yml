version: 2

models:
  - name: stg_fact_transactions
    description: "Staged transaction fact with derived columns"
    columns:
      - name: transaction_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_users')
              field: user_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_products')
              field: product_id
      - name: location_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_locations')
              field: location_id
      - name: amount
        tests:
          - not_null
      - name: payment_status
        tests:
          - not_null
