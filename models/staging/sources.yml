version: 2

sources:
  - name: analytics_raw
    description: "Synthetic star-schema dataset for analytics"
    schema: main
    tables:
      # Dimension Tables
      - name: dim_users
        description: "User dimension — 50,000 synthetic users"
        meta:
          external_location: "read_parquet('data/raw/dim_users.parquet')"

      - name: dim_products
        description: "Product dimension — 200 synthetic products"
        meta:
          external_location: "read_parquet('data/raw/dim_products.parquet')"

      - name: dim_locations
        description: "Location dimension — 500 synthetic locations"
        meta:
          external_location: "read_parquet('data/raw/dim_locations.parquet')"

      - name: dim_devices
        description: "Device dimension — 100 synthetic devices"
        meta:
          external_location: "read_parquet('data/raw/dim_devices.parquet')"

      # Fact Tables
      - name: fact_transactions
        description: "Transaction fact — 1,000,000 rows"
        meta:
          external_location: "read_parquet('data/raw/fact_transactions.parquet')"

      - name: fact_sessions
        description: "Session fact — 500,000 rows"
        meta:
          external_location: "read_parquet('data/raw/fact_sessions.parquet')"

      - name: fact_events
        description: "Event fact — 5,000,000 rows"
        meta:
          external_location: "read_parquet('data/raw/fact_events.parquet')"
