version: 2

sources:
  - name: analytics_raw
    description: "Synthetic star-schema dataset for analytics, generated by generate_data.py"
    database: memory
    schema: main
    tables:

      # -----------------------------------------------------------------------
      # Dimension Tables
      # -----------------------------------------------------------------------

      - name: dim_users
        description: "User dimension table — 50,000 synthetic users"
        meta:
          external_location: "data/raw/dim_users.parquet"
        columns:
          - name: user_id
            description: "Primary key (UUID)"
            tests:
              - unique
              - not_null
          - name: email
            description: "Unique user email address"
            tests:
              - unique
              - not_null
          - name: first_name
            tests:
              - not_null
          - name: last_name
            tests:
              - not_null
          - name: country
            tests:
              - not_null
          - name: city
            tests:
              - not_null
          - name: timezone
            tests:
              - not_null
          - name: signup_date
            description: "Date the user signed up (2022-01-01 to 2024-12-31)"
            tests:
              - not_null
          - name: user_tier
            description: "User tier — free (70%), premium (25%), enterprise (5%)"
            tests:
              - not_null
              - accepted_values:
                  values: ["free", "premium", "enterprise"]
          - name: is_active
            description: "Whether the user account is active (80% true)"
            tests:
              - not_null

      - name: dim_products
        description: "Product dimension table — 200 synthetic products"
        meta:
          external_location: "data/raw/dim_products.parquet"
        columns:
          - name: product_id
            description: "Primary key (UUID)"
            tests:
              - unique
              - not_null
          - name: product_name
            tests:
              - unique
              - not_null
          - name: product_category
            description: "Product category"
            tests:
              - not_null
              - accepted_values:
                  values: ["subscription", "add-on", "credit_pack"]
          - name: base_price
            description: "Base price in USD (range $5–$500)"
            tests:
              - not_null
          - name: created_at
            tests:
              - not_null

      - name: dim_locations
        description: "Location dimension table — 500 synthetic locations"
        meta:
          external_location: "data/raw/dim_locations.parquet"
        columns:
          - name: location_id
            description: "Primary key (UUID)"
            tests:
              - unique
              - not_null
          - name: country_code
            description: "ISO 3166-1 alpha-2 country code"
            tests:
              - not_null
          - name: country_name
            tests:
              - not_null
          - name: region
            description: "Continental region"
            tests:
              - not_null
          - name: latitude
            tests:
              - not_null
          - name: longitude
            tests:
              - not_null
          - name: timezone
            tests:
              - not_null

      - name: dim_devices
        description: "Device dimension table — 100 synthetic devices"
        meta:
          external_location: "data/raw/dim_devices.parquet"
        columns:
          - name: device_id
            description: "Primary key (UUID)"
            tests:
              - unique
              - not_null
          - name: device_type
            description: "Device type — mobile (60%), desktop (30%), tablet (10%)"
            tests:
              - not_null
              - accepted_values:
                  values: ["mobile", "desktop", "tablet"]
          - name: os
            tests:
              - not_null
              - accepted_values:
                  values: ["iOS", "Android", "Windows", "macOS", "Linux"]
          - name: browser
            tests:
              - not_null
              - accepted_values:
                  values: ["Chrome", "Safari", "Firefox", "Edge"]

      # -----------------------------------------------------------------------
      # Fact Tables
      # -----------------------------------------------------------------------

      - name: fact_transactions
        description: "Transaction fact table — 1,000,000 rows"
        meta:
          external_location: "data/raw/fact_transactions.parquet"
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
        loaded_at_field: transaction_timestamp
        columns:
          - name: transaction_id
            description: "Primary key (UUID)"
            tests:
              - unique
              - not_null
          - name: user_id
            description: "FK → dim_users.user_id"
            tests:
              - not_null
              - relationships:
                  to: source('analytics_raw', 'dim_users')
                  field: user_id
          - name: product_id
            description: "FK → dim_products.product_id"
            tests:
              - not_null
              - relationships:
                  to: source('analytics_raw', 'dim_products')
                  field: product_id
          - name: location_id
            description: "FK → dim_locations.location_id"
            tests:
              - not_null
              - relationships:
                  to: source('analytics_raw', 'dim_locations')
                  field: location_id
          - name: transaction_date
            description: "Date portion of the transaction (2023-01-01 to 2026-03-31)"
            tests:
              - not_null
          - name: transaction_timestamp
            description: "Full timestamp of the transaction"
            tests:
              - not_null
          - name: amount
            description: "Transaction amount in the applicable currency"
            tests:
              - not_null
          - name: currency
            description: "Currency code (USD, EUR, GBP, AUD)"
            tests:
              - not_null
              - accepted_values:
                  values: ["USD", "EUR", "GBP", "AUD"]
          - name: payment_status
            description: "Status — success (92%), failed (5%), pending (3%)"
            tests:
              - not_null
              - accepted_values:
                  values: ["success", "failed", "pending"]
          - name: discount_applied
            description: "Discount fraction applied (0.0–0.5)"
            tests:
              - not_null
          - name: tax_amount
            description: "Tax amount; $0 for failed transactions"
            tests:
              - not_null

      - name: fact_sessions
        description: "Session fact table — 500,000 rows"
        meta:
          external_location: "data/raw/fact_sessions.parquet"
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
        loaded_at_field: end_time
        columns:
          - name: session_id
            description: "Primary key (UUID)"
            tests:
              - unique
              - not_null
          - name: user_id
            description: "FK → dim_users.user_id"
            tests:
              - not_null
              - relationships:
                  to: source('analytics_raw', 'dim_users')
                  field: user_id
          - name: device_id
            description: "FK → dim_devices.device_id"
            tests:
              - not_null
              - relationships:
                  to: source('analytics_raw', 'dim_devices')
                  field: device_id
          - name: start_time
            tests:
              - not_null
          - name: end_time
            tests:
              - not_null
          - name: session_duration_minutes
            description: "Calculated duration in minutes (end_time - start_time)"
            tests:
              - not_null
          - name: page_views
            description: "Number of page views in the session (1–50)"
            tests:
              - not_null
          - name: events_count
            description: "Total events recorded in the session (1–100)"
            tests:
              - not_null

      - name: fact_events
        description: "Event fact table — 5,000,000 rows"
        meta:
          external_location: "data/raw/fact_events.parquet"
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
        loaded_at_field: event_timestamp
        columns:
          - name: event_id
            description: "Primary key (UUID)"
            tests:
              - unique
              - not_null
          - name: user_id
            description: "FK → dim_users.user_id"
            tests:
              - not_null
              - relationships:
                  to: source('analytics_raw', 'dim_users')
                  field: user_id
          - name: device_id
            description: "FK → dim_devices.device_id"
            tests:
              - not_null
              - relationships:
                  to: source('analytics_raw', 'dim_devices')
                  field: device_id
          - name: location_id
            description: "FK → dim_locations.location_id"
            tests:
              - not_null
              - relationships:
                  to: source('analytics_raw', 'dim_locations')
                  field: location_id
          - name: event_timestamp
            description: "Timestamp of the event (within its session window)"
            tests:
              - not_null
          - name: event_type
            description: "Type of event"
            tests:
              - not_null
              - accepted_values:
                  values:
                    ["page_view", "button_click", "form_submit", "error", "logout"]
          - name: page_url
            description: "URL slug of the page where the event occurred"
            tests:
              - not_null
          - name: session_id
            description: "FK → fact_sessions.session_id"
            tests:
              - not_null
              - relationships:
                  to: source('analytics_raw', 'fact_sessions')
                  field: session_id
          - name: duration_seconds
            description: "Duration of the event in seconds (1–600)"
            tests:
              - not_null
