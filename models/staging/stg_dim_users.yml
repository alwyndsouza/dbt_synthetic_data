version: 2

models:
  - name: stg_dim_users
    description: Staging model for user dimension table. Cleans and standardizes user data from the source.
    columns:
      - name: user_id
        description: Primary key - unique identifier for each user
        tests:
          - unique
          - not_null
      - name: email
        description: User's email address
        tests:
          - not_null
      - name: first_name
        description: User's first name
      - name: last_name
        description: User's last name
      - name: country
        description: User's country of residence
      - name: city
        description: User's city of residence
      - name: timezone
        description: User's timezone
      - name: signup_date
        description: Date when user registered
      - name: user_tier
        description: User tier classification (e.g., free, premium)
      - name: is_active
        description: Whether user account is active
